<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather | AgriMarket &amp; Weather</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="weather">
<header id="site-header"></header>
<main>
<section class="wrap">
  <h1>Weather <span class="tag">Demo Weather Data</span></h1>
  <p class="note">Weather values are sample data for demonstration, not a live forecast.</p>
  <form class="filters" id="wForm" novalidate>
    <label>Location <input type="search" id="wSearch" list="wList" placeholder="e.g. Salem" maxlength="30"></label>
    <datalist id="wList"></datalist>
    <button class="btn" type="submit">Show weather</button>
  </form>
  <p class="error" id="wError" role="alert"></p>
  <div class="card" id="wCurrent"></div>
  <div class="card advice" id="wAdvice"></div>
  <h2>Today&#39;s forecast</h2>
  <div class="grid" id="wToday"></div>
  <h2>5-day forecast</h2>
  <div class="grid" id="wDays"></div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="script.js"></script>
</body>
</html>
