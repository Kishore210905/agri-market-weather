<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop Guide | AgriMarket &amp; Weather</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="crops">
<header id="site-header"></header>
<main>
<section class="wrap">
  <h1>Crop Guide</h1>
  <form class="filters" id="cForm" novalidate>
    <label>Search crop <input type="search" id="cSearch" placeholder="e.g. Rice" maxlength="30"></label>
    <label>Season <select id="cSeason"></select></label>
  </form>
  <div class="grid" id="cGrid"></div>
  <p class="empty" id="cEmpty" hidden>No data found. Please try another crop or market.</p>
</section>
</main>
<footer id="site-footer"></footer>
<script src="script.js"></script>
</body>
</html>
