<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Prices | AgriMarket &amp; Weather</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="market">
<header id="site-header"></header>
<main>
<section class="wrap">
  <h1>Market Prices <span class="tag">Demo Data</span></h1>
  <p class="note">These prices are sample values for demonstration. They are not live and not from a government API.</p>
  <form class="filters" id="marketForm" novalidate>
    <label>Crop name <input type="search" id="mSearch" placeholder="e.g. Tomato" maxlength="30"></label>
    <label>Category <select id="mCategory"></select></label>
    <label>Market <select id="mMarket"></select></label>
    <button class="btn" type="button" id="mReset">Reset</button>
  </form>
  <p class="error" id="mError" role="alert"></p>
  <p class="small" id="mCount"></p>
  <div class="table-wrap"><table>
    <thead><tr><th>Crop</th><th>Market</th><th>Location</th><th>Min</th><th>Max</th><th>Modal</th><th>Unit</th><th>Trend</th><th>Updated</th></tr></thead>
    <tbody id="mBody"></tbody>
  </table></div>
  <p class="empty" id="mEmpty" hidden>No data found. Please try another crop or market.</p>
</section>
</main>
<footer id="site-footer"></footer>
<script src="script.js"></script>
</body>
</html>
